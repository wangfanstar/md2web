<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>参考文献库</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#718096; --line:#e6ebf1; --blue:#2563eb; --blue-soft:#eef4ff; --panel:#fff; --canvas:#f4f7fb; --shadow:0 18px 45px rgba(40,59,90,.08); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .shell { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:100vh; }
    .side { background:#132238; color:#dce7f7; padding:28px 16px; }
    .brand { display:flex; gap:10px; align-items:center; margin:0 10px 30px; font-size:17px; font-weight:700; letter-spacing:.02em; }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border-radius:9px; background:#4f8cff; color:#fff; font-size:16px; }
    .side-label { color:#8296b1; font-size:11px; letter-spacing:.08em; margin:0 10px 9px; }
    .kind-nav { display:grid; gap:5px; }
    .kind-nav button { width:100%; border:0; border-radius:8px; background:transparent; color:#bdcbe0; cursor:pointer; display:flex; align-items:center; gap:10px; padding:10px; text-align:left; font:inherit; }
    .kind-nav button:hover,.kind-nav button.active { background:#223653; color:#fff; }
    .kind-dot { width:9px; height:9px; border-radius:50%; background:#ef8354; box-shadow:0 0 0 4px rgba(239,131,84,.12); }
    [data-kind-nav="word"] .kind-dot { background:#4f8cff; box-shadow:0 0 0 4px rgba(79,140,255,.12); }
    [data-kind-nav="excel"] .kind-dot { background:#55b987; box-shadow:0 0 0 4px rgba(85,185,135,.12); }
    .side-links { border-top:1px solid rgba(220,231,247,.12); margin-top:30px; padding:20px 10px 0; display:grid; gap:12px; }
    .side-links a { color:#9fb2cc; font-size:12px; text-decoration:none; } .side-links a:hover { color:#fff; }
    .main { min-width:0; padding:34px clamp(20px,4vw,58px) 60px; }
    .topline { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:24px; }
    h1 { font-size:26px; letter-spacing:-.02em; margin:0 0 5px; } .sub { color:var(--muted); margin:0; font-size:13px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    button,.button { border:1px solid #d5dee8; border-radius:7px; background:var(--panel); color:#315b99; cursor:pointer; font:inherit; font-size:13px; padding:8px 12px; text-decoration:none; }
    button:hover,.button:hover { border-color:#8fb2ef; color:var(--blue); } button.primary { background:var(--blue); border-color:var(--blue); color:#fff; } button.primary:hover { background:#1d4ed8; color:#fff; } button:disabled { cursor:not-allowed; opacity:.55; }
    .crumb-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:17px; }
    .crumb-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .crumb-home { color:var(--blue); font-size:13px; cursor:pointer; } .crumb-sep { color:#a8b4c4; } .crumb-current { font-size:14px; font-weight:650; }
    .stats { color:var(--muted); font-size:12px; margin-top:9px; }
    .list-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
    .list-head { align-items:center; border-bottom:1px solid var(--line); color:#8290a3; display:grid; grid-template-columns:minmax(260px,1fr) 150px 170px 160px; font-size:11px; letter-spacing:.04em; padding:11px 20px; }
    .item { align-items:center; border-bottom:1px solid #eff2f6; display:grid; grid-template-columns:minmax(260px,1fr) 150px 170px 160px; min-height:68px; padding:10px 20px; transition:background .15s ease; }
    .item:last-child { border-bottom:0; } .item:hover { background:#fbfcff; }
    .name { align-items:center; display:flex; gap:11px; min-width:0; } .name a { color:var(--ink); font-size:14px; overflow:hidden; text-decoration:none; text-overflow:ellipsis; white-space:nowrap; } .name a:hover { color:var(--blue); }
    .icon { align-items:center; background:var(--blue-soft); border-radius:9px; color:var(--blue); display:flex; flex:none; font-size:16px; height:34px; justify-content:center; width:34px; } .icon.file { background:#f2f5f8; color:#6a7890; }
    .muted { color:var(--muted); font-size:12px; } .actions-cell { display:flex; gap:5px; justify-content:flex-end; } .actions-cell button { font-size:12px; padding:5px 8px; } .danger { color:#b84242; }
    .empty { color:var(--muted); padding:48px 20px; text-align:center; } .empty strong { color:var(--ink); display:block; font-size:15px; margin-bottom:6px; }
    .status { color:#b45309; font-size:12px; margin-top:12px; min-height:18px; } .status.error { color:#b91c1c; }
    @media (max-width:800px) { .shell { display:block; } .side { padding:15px 16px; } .brand { margin-bottom:15px; } .kind-nav { display:flex; overflow:auto; } .kind-nav button { min-width:110px; } .side-label,.side-links { display:none; } .main { padding:24px 15px 40px; } .topline { display:block; } .actions { justify-content:flex-start; margin-top:16px; } .list-head { display:none; } .item { grid-template-columns:1fr; gap:8px; padding:13px 15px; } .item > .muted { padding-left:45px; } .actions-cell { justify-content:flex-start; padding-left:45px; } }
    @media (prefers-reduced-motion:reduce) { .item { transition:none; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="brand-mark">▤</span><span>参考文献库</span></div>
      <div class="side-label">资料类型</div>
      <nav class="kind-nav" aria-label="资料类型">
        <button type="button" data-kind-nav="pdf"><span class="kind-dot"></span><span>PDF 标准</span></button>
        <button type="button" data-kind-nav="word"><span class="kind-dot"></span><span>Word 文档</span></button>
        <button type="button" data-kind-nav="excel"><span class="kind-dot"></span><span>Excel 表格</span></button>
      </nav>
      <div class="side-links"><a href="index.html">返回总览</a><a href="html/index_all.html">全部文档</a><a href="html/md2web_recycle.html">回收站</a></div>
    </aside>
    <main class="main">
      <div class="topline"><div><h1 data-title>PDF 标准</h1><p class="sub">按文件夹整理标准、规范与项目资料</p></div><div class="actions"><button type="button" data-up>刷新</button><button type="button" class="primary" data-upload>上传文件</button><button type="button" data-mkdir>新建文件夹</button><input type="file" data-file hidden></div></div>
      <section class="crumb-card"><div class="crumb-row"><span class="crumb-home" data-root>全部资料</span><span class="crumb-sep">/</span><strong class="crumb-current" data-breadcrumb>根目录</strong></div><div class="stats" data-stats>正在读取…</div><div class="status" data-status></div></section>
      <section class="list-card"><div class="list-head"><span>名称</span><span>类型</span><span>修改时间</span><span></span></div><div data-list></div></section>
    </main>
  </div>
  <script src="lib/auth.js?v=119d9241e0"></script><script src="lib/reference-library.js?v=756122938b"></script>
</body>
</html>
