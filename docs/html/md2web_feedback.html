<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>md2web 读者反馈</title>
  <style>
    :root { color-scheme: light; }
    body { background: #f7f9fb; color: #1f2a37; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 26px 18px 60px; }
    .wrap { margin: 0 auto; max-width: 1080px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { color: #57606a; font-size: 13px; margin: 0 0 16px; }
    .panel { background: #fff; border: 1px solid #e3e8ee; border-radius: 10px; margin-bottom: 14px; padding: 14px 16px; }
    .panel h2 { font-size: 14px; margin: 0 0 10px; }
    label { color: #475569; display: flex; flex-direction: column; font-size: 11.5px; gap: 4px; }
    input, textarea { border: 1px solid #d5dee8; border-radius: 6px; font: inherit; font-size: 13px; padding: 7px 9px; }
    textarea { min-height: 96px; resize: vertical; }
    button { background: #fff; border: 1px solid #d5dee8; border-radius: 6px; color: #1f6feb; cursor: pointer; font: inherit; font-size: 13px; padding: 6px 12px; }
    button:hover { border-color: #1f6feb; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .row { display: flex; flex-wrap: wrap; gap: 10px 12px; }
    .row > label { flex: 1 1 220px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
    .status { border-radius: 6px; font-size: 12.5px; margin-top: 10px; padding: 8px 10px; }
    .status.ok { background: #ecfdf5; color: #047857; }
    .status.error { background: #fef2f2; color: #b91c1c; }
    .hint { color: #6b7a89; font-size: 12px; }
    .panel-head { align-items: baseline; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .panel-head h2 { margin: 0; }
    .count { background: #eef2f7; border-radius: 999px; color: #64748b; font-size: 11px; padding: 2px 8px; }
    /* 反馈卡片样式由 md2web-feedback.js 注入（与弹窗共用），这里只保留页面框架 */
  </style>
</head>
<body>
  <div class="wrap">
    <h1>md2web 读者反馈</h1>
    <p class="sub">登录账号的读者可提交问题；未登录只能查看。管理员可更新处理进度与说明。</p>

    <section class="panel">
      <h2>当前状态</h2>
      <div class="actions">
        <span class="hint" data-user-label>正在读取登录状态…</span>
        <button type="button" data-action="login">登录</button>
        <button type="button" data-action="logout" hidden>退出</button>
        <button type="button" data-action="reload">刷新列表</button>
        <a href="index.html"><button type="button">返回总览</button></a>
      </div>
      <div class="status" data-status hidden></div>
    </section>

    <section class="panel" data-login-panel hidden>
      <h2>登录</h2>
      <div class="row">
        <label>用户名<input type="text" data-login-username autocomplete="username" placeholder="SVN 账号或本机管理员"></label>
        <label>密码<input type="password" data-login-password autocomplete="current-password"></label>
      </div>
      <div class="actions">
        <button class="primary" type="button" data-action="do-login">登录</button>
        <span class="hint">读者用 SVN 账号登录；管理员可用本机账号（默认 admin/admin）。</span>
      </div>
    </section>

    <section class="panel">
      <h2>提交反馈</h2>
      <p class="hint" data-submit-hint>登录后即可提交反馈。</p>
      <div class="row">
        <label>标题<input type="text" data-feedback-title placeholder="一句话描述问题" disabled></label>
      </div>
      <label>问题描述<textarea data-feedback-body placeholder="复现步骤、期望结果、实际结果…" disabled></textarea></label>
      <label>相关页面<input type="text" data-feedback-page placeholder="如 md/硬件设计/时钟树设计.md（可自动带入）" disabled></label>
      <div class="fd-field fd-field-wide"><span>截图 / 附件</span>
        <div class="fd-uploader" data-feedback-uploader>
          <div class="fd-uploader-actions">
            <button type="button" class="fd-btn" data-action="pick-image" disabled>选择图片</button>
            <button type="button" class="fd-btn" data-action="pick-attachment" disabled>上传附件</button>
            <span class="fd-hint">可直接粘贴截图（Ctrl+V）或把文件拖到这里</span>
          </div>
          <input type="file" accept="image/*" multiple hidden data-feedback-image-input>
          <input type="file" multiple hidden data-feedback-attachment-input>
          <div class="fd-pending" data-feedback-pending></div>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="button" data-action="submit" disabled>提交反馈</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>反馈列表与进度</h2>
        <span class="count" data-feedback-count>0 条</span>
      </div>
      <div class="actions">
        <label class="hint" style="flex-direction:row;align-items:center;gap:6px">筛选
          <select data-feedback-filter>
            <option value="">全部</option>
            <option value="open">待处理</option>
            <option value="in_progress">处理中</option>
            <option value="resolved">已解决</option>
            <option value="closed">已关闭</option>
          </select>
        </label>
      </div>
      <div data-feedback-list><p class="hint">正在加载…</p></div>
    </section>
  </div>
  <script src="lib/md2web-feedback.js?v=a8de97626a"></script>
</body>
</html>
