<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文档中心</title>
  <link rel="stylesheet" href="lib/auth.css">
  <style>
  :root { color-scheme: light; }
  body { background: #f7f9fb; color: #1f2a37; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 28px 20px 60px; }
  .wrap { margin: 0 auto; max-width: 1080px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #57606a; font-size: 13px; margin: 0 0 18px; }
  .tools { align-items: center; background: #fff; border: 1px solid #e3e8ee; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding: 8px; }
  .tools input { background: #f8fafc; border: 1px solid #d5dee8; border-radius: 7px; flex: 1 1 300px; font: inherit; min-width: 220px; padding: 8px 12px; }
  .tools input:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,.12); outline: 0; }
  .tools select { background: #fff; border: 1px solid #d5dee8; border-radius: 7px; color: #334155; font: inherit; padding: 8px 9px; }
  .tools label { align-items: center; color: #64748b; display: inline-flex; font-size: 12px; gap: 5px; white-space: nowrap; }
  .master-search-repo { position: relative; }
  .master-search-repo-toggle { align-items: center; background: #fff; border: 1px solid #d5dee8; border-radius: 7px; color: #334155; cursor: pointer; display: inline-flex; font: inherit; font-size: 12px; gap: 6px; padding: 8px 9px; }
  .master-search-repo-toggle:hover, .master-search-repo-toggle.is-active { border-color: #1f6feb; color: #1f6feb; }
  .master-search-repo-toggle.is-all { background: #eef4fd; border-color: #bfdbfe; }
  .master-search-repo-menu { background: #fff; border: 1px solid #d5dee8; border-radius: 8px; box-shadow: 0 12px 28px rgba(15,23,42,.16); min-width: 190px; padding: 6px; position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; }
  .master-search-repo-menu[hidden] { display: none; }
  .master-search-repo-actions { border-bottom: 1px dashed #e6ebf1; display: flex; gap: 6px; margin-bottom: 4px; padding: 2px 4px 6px; }
  .master-search-repo-actions button { background: #f6f9fc; border: 1px solid #dbe2ea; border-radius: 5px; color: #506174; cursor: pointer; font: inherit; font-size: 11px; padding: 3px 8px; }
  .master-search-repo-actions button.is-selected { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .master-search-repo-list { max-height: 220px; overflow: auto; }
  .master-search-repo-item { align-items: center; border-radius: 6px; cursor: pointer; display: flex; font-size: 12px; gap: 6px; padding: 5px 6px; }
  .master-search-repo-item:hover { background: #f2f6fb; }
  .master-search-repo-item input { margin: 0; }
  .tools a, .tools button { background: #fff; border: 1px solid #d5dee8; border-radius: 8px; color: #1f6feb; cursor: pointer; font: inherit; padding: 8px 14px; text-decoration: none; }
  .tools a:hover, .tools button:hover { border-color: #1f6feb; }
  h2 { font-size: 15px; margin: 22px 0 10px; color: #57606a; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: #fff; border: 1px solid #e3e8ee; border-radius: 10px; color: inherit; display: block; padding: 14px 16px; text-decoration: none; }
  .card:hover { border-color: #1f6feb; box-shadow: 0 6px 18px rgba(15, 23, 42, .08); }
  .card strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .card span { color: #57606a; display: block; font-size: 12.5px; overflow-wrap: anywhere; }
  .badge { background: #eef4fd; border-radius: 999px; color: #1f6feb; display: inline-block; font-size: 11px; margin-left: 6px; padding: 1px 8px; }
  .badge.readonly { background: #fff7ed; color: #b45309; }
  .results { margin: 6px 0 18px; }
  .master-mode-section { margin: 14px 0 18px; }
  .master-mode-title { align-items: baseline; border-bottom: 1px solid #e3e8ee; color: #334155; display: flex; font-size: 14px; gap: 8px; margin: 0 0 8px; padding: 0 2px 7px; }
  .master-mode-title span { color: #64748b; font-size: 11px; font-weight: 400; }
  .results a { background: #fff; border: 1px solid #e3e8ee; border-radius: 8px; color: inherit; display: block; margin-bottom: 6px; padding: 8px 12px; text-decoration: none; }
  .results a:hover { border-color: #1f6feb; }
  .results small { color: #6b7a89; display: block; }
  .empty { color: #57606a; font-size: 13px; }
  .hint { color: #57606a; font-size: 12.5px; margin: 0 0 16px; }
  .hint a { color: #1f6feb; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>文档中心</h1>
    <p class="sub">按仓库分组浏览；搜索默认覆盖全部仓库，并将文档名与全文结果分组显示。</p>
    <div class="tools">
      <input type="search" placeholder="搜索全部仓库（文档名和全文）" data-master-search
             aria-label="搜索全部仓库的文档名和全文">
      <div class="master-search-repo" data-master-repo-filter>
        <button type="button" class="master-search-repo-toggle is-all" data-master-repo-toggle aria-expanded="false" aria-label="搜索仓库范围"><span data-master-repo-label>仓库：全部仓库</span><span>▾</span></button>
        <div class="master-search-repo-menu" data-master-repo-menu hidden>
          <div class="master-search-repo-actions"><button type="button" data-master-repo-all class="is-selected" aria-pressed="true">全部仓库</button></div>
          <div class="master-search-repo-list" data-master-repo-list></div>
        </div>
      </div>
      <label>模式<select class="master-search-mode" data-master-mode aria-label="搜索模式"><option value="both" selected>文档名和全文</option><option value="file">仅文档名</option><option value="full">仅全文</option></select></label>
      <a href="html/index_all.html">全部文档（合并视图）</a>
      <a href="html/md2web_config.html">仓库配置</a>
      <a href="html/md2web_feedback.html">读者反馈</a>
      <a href="html/md2web_recycle.html?mount=md">回收站</a>
    </div>
    <p class="hint">当前搜索范围：<strong>全部仓库</strong>；默认模式：<strong>文档名和全文</strong>，结果按两类分组显示。</p>
    <div class="results" data-master-results></div>
    <h2>默认</h2><div class="cards"><a class="card" href="html/index_使用说明.html"><strong>使用说明<span class="badge readonly">未配置 SVN</span></strong><span>目录：md/使用说明</span><span>本地文件夹（不连接 SVN）</span></a><a class="card" href="html/index_硬件设计.html"><strong>硬件设计<span class="badge readonly">未配置 SVN</span></strong><span>目录：md/硬件设计</span><span>本地文件夹（不连接 SVN）</span></a><a class="card" href="html/index_软件工具链.html"><strong>软件工具链<span class="badge readonly">未配置 SVN</span></strong><span>目录：md/软件工具链</span><span>本地文件夹（不连接 SVN）</span></a><a class="card" href="html/index_验证指南.html"><strong>验证指南<span class="badge readonly">未配置 SVN</span></strong><span>目录：md/验证指南</span><span>本地文件夹（不连接 SVN）</span></a></div>
  </div>
  <script>window.__MD2WEB_REPOS__ = [{"id": "使用说明", "mount": "md/使用说明", "url": "", "group": "默认", "read_only": false, "allow_commit": true, "sync_interval": null, "auto": true}, {"id": "硬件设计", "mount": "md/硬件设计", "url": "", "group": "默认", "read_only": false, "allow_commit": true, "sync_interval": null, "auto": true}, {"id": "软件工具链", "mount": "md/软件工具链", "url": "", "group": "默认", "read_only": false, "allow_commit": true, "sync_interval": null, "auto": true}, {"id": "验证指南", "mount": "md/验证指南", "url": "", "group": "默认", "read_only": false, "allow_commit": true, "sync_interval": null, "auto": true}];</script>
  <script>
  var repos = window.__MD2WEB_REPOS__ || [];
  var index = null;
  var input = document.querySelector('[data-master-search]');
  var repoToggle = document.querySelector('[data-master-repo-toggle]');
  var repoMenu = document.querySelector('[data-master-repo-menu]');
  var repoList = document.querySelector('[data-master-repo-list]');
  var repoLabel = document.querySelector('[data-master-repo-label]');
  var repoAll = document.querySelector('[data-master-repo-all]');
  var masterRepoFilter = [];
  var repoFilterMode = 'all';
  var modeSelect = document.querySelector('[data-master-mode]');
  var results = document.querySelector('[data-master-results]');
  function load() {
    if (index) { return Promise.resolve(index); }
    return fetch('html/search-index.json').then(function (r) { return r.json(); }).then(function (data) {
      index = data; return data;
    }).catch(function () { index = {}; return index; });
  }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
    });
  }
  function flatten(data) {
    var hits = [];
    Object.keys(data || {}).forEach(function (routeKey) {
      var page = data[routeKey] || {};
      Object.keys(page).forEach(function (slug) {
        var entry = page[slug] || {};
        if (!entry.route && routeKey === '/') { return; }
        hits.push({
          route: entry.route || routeKey,
          title: entry.headingTitle || entry.title || entry.pageTitle || routeKey,
          pageTitle: entry.pageTitle || entry.title || routeKey,
          body: entry.body || '',
          site: page.site || 'html/index_all.html'
        });
      });
    });
    return hits;
  }
  function repoNames() {
    return repos.map(function (repo) { return String(repo.id || repo.mount || ''); }).filter(Boolean);
  }
  function renderRepoMenu() {
    if (!repoList) { return; }
    var names = repoNames();
    repoList.innerHTML = names.map(function (name) {
      var checked = repoFilterMode === 'all' || masterRepoFilter.indexOf(name) !== -1;
      return '<label class="master-search-repo-item"><input type="checkbox" data-master-repo-name="' + escapeHtml(name) + '"' + (checked ? ' checked' : '') + '><span>' + escapeHtml(name) + '</span></label>';
    }).join('') || '<span class="empty">没有可过滤的仓库</span>';
    if (repoLabel) { repoLabel.textContent = repoFilterMode === 'all' ? '仓库：全部仓库' : (repoFilterMode === 'none' ? '仓库：未选择' : '仓库：' + masterRepoFilter.length + ' 个'); }
    if (repoToggle) {
      repoToggle.classList.toggle('is-all', repoFilterMode === 'all');
      repoToggle.classList.toggle('is-active', repoFilterMode !== 'all');
    }
    if (repoAll) {
      repoAll.classList.toggle('is-selected', repoFilterMode === 'all');
      repoAll.setAttribute('aria-pressed', repoFilterMode === 'all' ? 'true' : 'false');
      repoAll.title = repoFilterMode === 'all' ? '已全选，再次点击取消全选' : '选择全部仓库';
    }
  }
  function toggleAllRepos() {
    if (repoFilterMode === 'all') {
      masterRepoFilter = [];
      repoFilterMode = 'none';
    } else {
      masterRepoFilter = repoNames();
      repoFilterMode = 'all';
    }
    renderRepoMenu();
    search(input && input.value);
  }
  function repoMatches(hit) {
    if (repoFilterMode === 'none') { return false; }
    if (repoFilterMode === 'all') { return true; }
    var route = String(hit.route || '').replace(/^\/+|\/+$/g, '');
    return repos.some(function (item) {
      var name = String(item.id || item.mount || '');
      if (masterRepoFilter.indexOf(name) === -1) { return false; }
      var mount = String(item.mount || '').replace(/^\/+|\/+$/g, '');
      return !!mount && (route === mount || route.indexOf(mount + '/') === 0);
    });
  }
  function renderMode(mode, hits) {
    if (!hits.length) { return ''; }
    var label = mode === 'file' ? '文档名匹配' : '全文匹配';
    return '<section class="master-mode-section"><h3 class="master-mode-title">' + label + '<span>' + hits.length + ' 条</span></h3>' +
      hits.slice(0, 40).map(function (hit) {
        var href = hit.site + '#/' + String(hit.route || '/').replace(/^\//, '');
        return '<a href="' + escapeHtml(href) + '"><strong>' + escapeHtml(hit.title) + '</strong>'
          + '<small>' + escapeHtml(hit.site) + ' · ' + escapeHtml(hit.route) + '</small>'
          + (mode === 'full' && hit.body ? '<small>' + escapeHtml(hit.body.slice(0, 120)) + '</small>' : '') + '</a>';
      }).join('') + '</section>';
  }
  function search(query) {
    load().then(function (data) {
      var keyword = String(query || '').trim().toLowerCase();
      if (!keyword || (keyword.length < 2 && !/[一-鿿]/.test(keyword))) { results.innerHTML = ''; return; }
      var modes = modeSelect && modeSelect.value === 'both' ? ['file', 'full'] : [modeSelect ? modeSelect.value : 'both'];
      var flattened = flatten(data).filter(repoMatches);
      var html = modes.map(function (mode) {
        return renderMode(mode, flattened.filter(function (hit) {
          var fileText = [hit.route, hit.pageTitle, hit.title].join(' ').toLowerCase();
          return (mode === 'file' ? fileText : String(hit.body || '').toLowerCase()).indexOf(keyword) !== -1;
        }));
      }).join('');
      results.innerHTML = html || '<p class="empty">没有匹配的文档，请尝试更换关键词、仓库或搜索模式。</p>';
    });
  }
  function rememberReadingQuery(href, query) {
    var value = String(href || '');
    var hashIndex = value.indexOf('#');
    if (hashIndex === -1 || !query) { return; }
    var route = value.slice(hashIndex + 1).split('?')[0].replace(/[.]md$/i, '').replace(/\/+$/, '') || '/';
    try {
      localStorage.setItem('md2web:search-reading', JSON.stringify({
        query: query, route: route, at: Date.now()
      }));
    } catch (error) { /* 隐私模式忽略 */ }
  }

  if (results) {
    results.addEventListener('click', function (event) {
      var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
      if (link && input) {
        rememberReadingQuery(link.getAttribute('href'), input.value.trim());
      }
    }, true);
  }

  if (input) {
    input.addEventListener('input', function () { search(input.value); });
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        var first = results.querySelector('a');
        if (first) { window.location.href = first.getAttribute('href'); }
      }
    });
  }
  renderRepoMenu();
  if (repoToggle && repoMenu) {
    repoToggle.addEventListener('click', function () {
      repoMenu.hidden = !repoMenu.hidden;
      repoToggle.setAttribute('aria-expanded', repoMenu.hidden ? 'false' : 'true');
    });
  }
  if (repoAll) { repoAll.addEventListener('click', toggleAllRepos); }
  if (repoList) {
    repoList.addEventListener('change', function (event) {
      var name = event.target && event.target.getAttribute('data-master-repo-name');
      if (!name) { return; }
      var index = masterRepoFilter.indexOf(name);
      if (repoFilterMode === 'all') {
        masterRepoFilter = repoNames();
        repoFilterMode = 'selected';
        index = masterRepoFilter.indexOf(name);
      }
      if (event.target.checked && index === -1) { masterRepoFilter.push(name); }
      if (!event.target.checked && index !== -1) { masterRepoFilter.splice(index, 1); }
      repoFilterMode = masterRepoFilter.length === 0 ? 'none' : (masterRepoFilter.length === repoNames().length ? 'all' : 'selected');
      renderRepoMenu();
      search(input && input.value);
    });
  }
  if (modeSelect) { modeSelect.addEventListener('change', function () { search(input && input.value); }); }
</script>
  <script src="lib/auth.js"></script>
  <script src="lib/md2web-feedback.js"></script>
</body>
</html>
