<head>
  <meta charset="UTF-8">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Cpath d='M9 8.5h14v2.6H9zm0 6h14v2.6H9zm0 6h9v2.6H9z' fill='%23fff'/%3E%3C/svg%3E">

<body>
  <script src="lib/offline-data.js?v=10ed969188"></script>
  <script src="lib/offline-file.js?v=9e57b7a7e9"></script>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: "文档中心",
      repo: '',
      loadSidebar: true,
      alias: {
        '/_sidebar.md': '/_sidebar.md',
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      homepage: false,
      coverpage: false,
      routeSidebar: true,
      homeLink: "index.html",
      relativePath: true,
      repoList: [],
      repoReadOnly: false,
      repoAllowCommit: true,
      repoInfo: {"all": true},
      subMaxLevel: 0,
      auto2top: true,
      noEmoji: true,
      plugins: [function (hook) {
        // Prism 无对应组件的语言（cuda/p4/asm 等）改用近似语法高亮，源 md 不受影响
        var langMap = {"cuda": "cpp", "p4": "c", "asm": "nasm"};
        hook.beforeEach(function (content) {
          var inFence = false, fenceChar = '';
          return content.split('\n').map(function (line) {
            var m = line.match(/^\s*(`{3,}|~{3,})(.*)$/);
            if (m) {
              var marker = m[1].charAt(0);
              if (!inFence) {
                inFence = true; fenceChar = marker;
                var lm = m[2].match(/^\s*([A-Za-z0-9_+#.-]+)/);
                if (lm) {
                  var target = langMap[lm[1].toLowerCase()];
                  if (target) {
                    return line.replace(lm[1], target);
                  }
                }
              } else if (marker === fenceChar) {
                inFence = false; fenceChar = '';
              }
            }
            return line;
          }).join('\n');
        });
      }],
      customSearch: {
        indexPath: 'search-index.json',
        maxSidebarResults: 8,
        maxDialogResults: 50,
        minQueryLength: 2,
      },
      customToc: {
        enabled: true,
        minLevel: 2,
        maxLevel: 4,
        title: '本文目录',
      },
    }
  </script>
  <script src="lib/docsify.min.js?v=file-router-3"></script>
  <script src="lib/prism-autoloader.min.js?v=b7aa0333d8"></script>
  <script>
    // docsify 会覆盖 window.Prism，因此 autoloader 必须在 docsify 之后加载；
    // 语言组件改从本地 lib/components/ 加载，运行时不请求 CDN
    if (window.Prism && Prism.plugins && Prism.plugins.autoloader) {
      Prism.plugins.autoloader.languages_path = 'lib/components/';
    }
  </script>
  <script src="lib/prism-init.js?v=b0f4445ad6"></script>
  <script src="lib/front-matter.min.js?v=a6e389495a"></script>
  <script src="lib/marked.min.js?v=c74cc46804"></script>
  <script src="lib/purify.min.js?v=2230c2d462"></script>

</body>
