<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>md2web 回收站</title>
  <style>
    :root { color-scheme: light; }
    body { background:#f7f9fb; color:#1f2a37; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif; margin:0; padding:26px 18px 60px; }
    .wrap { max-width:1120px; margin:0 auto; }
    h1 { font-size:23px; margin:0 0 6px; } .sub,.hint { color:#64748b; font-size:13px; }
    .panel { background:#fff; border:1px solid #e3e8ee; border-radius:10px; padding:14px 16px; margin:0 0 14px; }
    .panel-head { align-items:center; display:flex; flex-wrap:wrap; gap:9px; justify-content:space-between; }
    .panel h2 { font-size:15px; margin:0; } .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button,.back { background:#fff; border:1px solid #d5dee8; border-radius:6px; color:#1f6feb; cursor:pointer; font:inherit; font-size:13px; padding:6px 11px; text-decoration:none; }
    button:hover,.back:hover { border-color:#1f6feb; } button.primary { background:#1f6feb; color:#fff; border-color:#1f6feb; } button.danger { color:#b91c1c; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .status { border-radius:6px; font-size:13px; margin-top:10px; padding:8px 10px; } .status.error { background:#fef2f2; color:#b91c1c; } .status.ok { background:#ecfdf5; color:#047857; }
    .trash-item { border-top:1px solid #eef2f7; display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; padding:11px 0; }
    .trash-item:first-child { border-top:0; } .item-main { min-width:240px; flex:1; } .item-name { font-weight:600; word-break:break-all; } .item-meta { color:#64748b; font-size:12px; margin-top:4px; }
    .empty { color:#94a3b8; font-size:13px; padding:9px 0; } .login { color:#b45309; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>回收站</h1>
    <p class="sub">删除的文档会先保留在对应 SVN 仓库的“回收站”目录。恢复会还原原路径，永久删除会同步移除 SVN 中的回收站副本。</p>
    <section class="panel">
      <div class="actions"><a class="back" href="index.html">返回总览</a><a class="back" href="html/index_all.html">全部文档</a><button type="button" data-action="reload">刷新</button></div>
      <div class="status" data-status hidden></div>
    </section>
    <main data-trash-root><p class="hint">正在读取回收站…</p></main>
  </div>
  <script src="lib/auth.js"></script>
  <script src="lib/md2web-recycle.js"></script>
</body>
</html>
