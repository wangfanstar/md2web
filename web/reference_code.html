<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>参考代码库</title><link rel="stylesheet" href="lib/auth.css"><style>body{font:14px/1.7 system-ui;margin:24px;color:#243247}header,form{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}main{display:grid;grid-template-columns:300px 1fr;gap:24px}aside{max-height:75vh;overflow:auto}button,a{cursor:pointer}pre{overflow:auto;background:#f5f8fc;padding:16px}pre a{display:block;white-space:pre;color:inherit;text-decoration:none}pre a:target{background:#fff2ad}input{min-width:240px}#status{color:#64748b}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header><a href="index.html">返回首页</a><h2>参考代码库</h2><select id="repo" aria-label="代码仓库"></select><button id="root">仓库根目录</button><button id="copy">复制当前行链接</button><button id="ask">就此位置问 AI</button></header><form id="search"><input id="q" required placeholder="搜索文件名、路径或代码"><select id="mode"><option value="path">文件名 / 路径</option><option value="text">全文</option></select><button>搜索</button></form><p id="status" role="status">正在读取，请先登录</p><main><aside id="tree"></aside><section><h3 id="path"></h3><div id="results"></div><pre id="source"></pre></section></main><script src="lib/auth.js"></script><script src="lib/reference-code.js"></script></body></html>
